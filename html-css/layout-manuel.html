<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo Básico de Maquetación Web</title>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/029874ded0.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Red+Hat+Mono&display=swap" rel="stylesheet">

    <!-- Mis estilos -->
    <link rel="stylesheet" href="./css-y-html/mystyle.css">
</head>

<body>
    <!-- Cabecera de la página con menú de navegación -->
    <header>
        <!-- Menú de navegación -->
        <nav>
            <!-- Logo -->
            <div class="logo">
                <img src="img/logo.png" alt="Logo">
            </div>
            <!-- Enlaces del menú de navegación -->
            <ul class="enlaces">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Acerca de</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
        <!-- Contenedor para una imagen, slider o video (BIG HERO) -->
        <div class="big-hero">
            <!-- Imagen, video o slider -->
        </div>
    </header>

    <!-- Contenido Principal -->
    <main>
        <!-- Contenido de la página -->
    </main>

    <!-- Pie de página -->
    <footer>
        <!-- logo -->
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
        </div>

        <!-- Créditos -->
        <div class="creditos">
            <p>Trabajo realizado en el curso de Desarrollo de Aplicaciones Web</p>
        </div>

        <!-- Menú de navegación de redes sociales -->
        <nav>
            <h3>Redes Sociales</h3>
        </nav>
    </footer>
</body>

</html>
